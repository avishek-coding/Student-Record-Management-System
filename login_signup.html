<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login & Signup</title>
    <link rel="stylesheet" href="/css/login_signup.css">
    <script type="module" src="register.js" defer></script>
</head>

<body>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- Hidden Toggle -->
        <input type="checkbox" id="toggle">

        <!-- LOGIN FORM -->
        <div class="form-box login">
            <h2>Login</h2>
            <form action="#">
                <input type="email" name="email" class="mail" placeholder="Email" required>
                <input type="password" name="password" class="password" placeholder="Password" required>
                <button class="submit" type="submit">Login</button>
            </form>
            <p>Don't have an account?
                <label for="toggle">Sign Up</label>
            </p>
        </div>

        <!-- SIGNUP FORM -->
        <div class="form-box signup">
            <h2>Create Account</h2>
            <form action="#">
                <input type="text" name="username" placeholder="Full Name" required maxlength="30">
                <input type="tel" name="reg" placeholder="Registration No" pattern="[0-9]{10}" required>
                <input type="tel" name="roll" placeholder="Roll No" pattern="[0-9]{10}" required>
                <input type="email" name="email" class="mail" placeholder="Email" required>
                <input type="password" name="password" class="password" placeholder="Password" required>
                <button class="submit" type="submit">Sign Up</button>
            </form>
            <p>Already have an account?
                <label for="toggle">Login</label>
            </p>
        </div>

    </div> <!-- ✅ END CONTAINER -->


    <!-- FOOTER (NOW CORRECTLY PLACED) -->
    <footer>
        <section class="footer">
            <div class="footer-container">

                <div class="footer-left">
                    <h1>Student<br>Record Management<br>System®</h1>
                </div>

                <div class="footer-column">
                    <h3>India</h3>
                    <p>Email : SRMS@makaut.com</p>
                    <p>Contact : +91 8956253641</p>
                    <p>NH-12, Haringhata, Nadia, West Bengal, Pin-741249</p>
                    <a href="https://www.google.com/maps/place/MAKAUT+Main+Gate+(WBUT)/@22.9574381,88.5442965,17z"
                        target="_blank" class="map-link">
                        Locate us ↗
                    </a>
                </div>

                <div class="footer-right">
                    <h3 class="follow-heading">FOLLOW US -</h3>

                    <div class="follow-links">
                        <a href="https://facebook.com/facebook" target="_blank">Facebook</a>
                        <a href="https://instagram.com/instagram" target="_blank">Instagram</a>
                        <a href="https://youtube.com/@youtube" target="_blank">YouTube</a>
                        <a href="https://whatsapp.com" target="_blank">WhatsApp</a>
                    </div>
                </div>

            </div>
        </section>
    </footer>

</body>

</html>
